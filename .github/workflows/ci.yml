name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Validate package and scripts
        run: |
          plutil -lint Packaging/Info.plist
          python3 -m json.tool Sources/CodexDashboard/Resources/Dashboard/injection-manifest.json >/dev/null
          zsh -n install.sh uninstall.sh
      - name: Test
        run: swift test
      - name: Build release
        run: swift build -c release
